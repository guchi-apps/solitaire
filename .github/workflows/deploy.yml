name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          HEAD_SHA=$(git rev-parse HEAD)

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "$TAG")
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              echo "Tag ${TAG} already points to HEAD"
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on ${TAG_SHA}, but HEAD is ${HEAD_SHA}. Bump package.json version before merging."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  build:
    runs-on: ubuntu-latest
    needs: tag

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        run: npm run build

      - name: Prepare deploy bundle
        run: |
          mkdir -p dist
          cp index.html styles.css manifest.webmanifest sw.js dist/
          cp -r js assets dist/
          cp deploy/.htaccess dist/.htaccess
          test -f dist/assets/icon-192.png
          test -f dist/assets/icon-512.png
          test -f dist/assets/favicon-32.png

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: dist/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SSH_HOST: ${{ secrets.SERVER_HOST }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
      SSH_USERNAME: ${{ secrets.SERVER_USERNAME }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-bundle
          path: dist/

      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ env.SSH_PRIVATE_KEY }}
          ARGS: "-rlDzvc -i --delete"
          SOURCE: "dist/"
          REMOTE_HOST: ${{ env.SSH_HOST }}
          REMOTE_USER: ${{ env.SSH_USERNAME }}
          TARGET: ${{ env.DEPLOY_PATH }}
          REMOTE_PORT: ${{ env.SSH_PORT }}

      # rsync は --delete 付きのため、DEPLOY_PATH の設定ミスやビルド成果物の
      # 取りこぼしで公開ディレクトリを空にしてしまう事故が起こり得る。転送が
      # 終わっただけでは緑にせず、公開URLの応答と中身まで確認する（#81）。
      #
      # deploy ジョブには SSH セッションが無い（easingthemes/ssh-deploy が内部で
      # rsync するだけ）ので、ランナーから公開HTTPSを叩く。経路に Apache と TLS が
      # 含まれるため vhost の破損も一緒に検知できる。
      #
      # 標準（guchi-apps/docs の standards/ci-deploy.md）は 2秒間隔・最大60秒だが、
      # solitaire は静的サイトで再起動するプロセスが無く起動待ちが存在しない。
      # Apache の reload と重なった瞬断だけを吸収できればよいので 5回（10秒）にする。
      - name: Health check
        env:
          # 公開URLなので secrets にする必要は無い（このリポジトリは public）。
          HEALTH_CHECK_URL: https://klondike.game.gucchii.com/
          # 配信されているのがビルド成果物であることの目印（index.html のルート要素）。
          # 200 だけを見ると、空ディレクトリを配信していても緑になり得る。
          HEALTH_CHECK_MARKER: '<div id="app"'
        run: |
          for i in $(seq 1 5); do
            if body=$(curl -fsS --max-time 10 "$HEALTH_CHECK_URL"); then
              if printf '%s' "$body" | grep -qF "$HEALTH_CHECK_MARKER"; then
                echo "Health check passed on attempt ${i}."
                exit 0
              fi
              echo "Attempt ${i}: responded, but marker was not found in the body."
            else
              echo "Attempt ${i}: request to ${HEALTH_CHECK_URL} failed."
            fi
            sleep 2
          done

          echo "::error::Health check failed for ${HEALTH_CHECK_URL} after 5 attempts."
          exit 1

  release:
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: meta
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          skip_if_release_exists: true

  notify:
    runs-on: ubuntu-latest
    needs: [tag, build, deploy]
    if: always()

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        run: |
          tag="${{ needs.tag.result }}"
          build="${{ needs.build.result }}"
          deploy="${{ needs.deploy.result }}"
          if [ "$tag" = "success" ] && [ "$build" = "success" ] && [ "$deploy" = "success" ]; then
            result=success
          elif [ "$tag" = "cancelled" ] || [ "$build" = "cancelled" ] || [ "$deploy" = "cancelled" ]; then
            result=cancelled
          else
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Signaly に通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を
        # 落とさない（guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: Solitaire
          NOTIFY_KIND: デプロイ
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
        run: bash .github/scripts/signaly-notify.sh

  notify-release:
    runs-on: ubuntu-latest
    needs: [tag, deploy, release]
    if: always() && needs.release.result != 'skipped'

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Signaly に通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を
        # 落とさない（guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_STATUS: ${{ needs.release.result }}
          NOTIFY_APP: Solitaire
          NOTIFY_KIND: リリース
          NOTIFY_VERSION: ${{ needs.tag.outputs.tag }}
        run: bash .github/scripts/signaly-notify.sh
