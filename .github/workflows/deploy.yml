name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          HEAD_SHA=$(git rev-parse HEAD)

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-parse "$TAG")
            if [ "$TAG_SHA" = "$HEAD_SHA" ]; then
              echo "Tag ${TAG} already points to HEAD"
              exit 0
            fi
            echo "::error::Tag ${TAG} already exists on ${TAG_SHA}, but HEAD is ${HEAD_SHA}. Bump package.json version before merging."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  build:
    runs-on: ubuntu-latest
    needs: tag

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        run: npm run build

      - name: Prepare deploy bundle
        run: |
          mkdir -p dist
          cp index.html styles.css manifest.webmanifest sw.js dist/
          cp -r js assets dist/
          cp deploy/.htaccess dist/.htaccess
          # 配信する版を外から確かめるための版情報（#193）。gate の照合（public/version.json）、
          # deploy ジョブの公開URLでの照合、issue-deck の稼働確認（公開URLとして登録する）が読む。
          node scripts/write-version-json.js dist "${{ github.sha }}"
          test -f dist/version.json
          test -f dist/.htaccess
          test -f dist/assets/icon-192.png
          test -f dist/assets/icon-512.png
          test -f dist/assets/favicon-32.png

      # **VPSのgate（/usr/local/sbin/app-deploy-gate。guchi-apps/vps#275・#305）へ渡す配布物**（#197）。
      # 静的アプリの形: 公開する中身は public/、目印は deploy/gate-static。gate は置き場
      # （/home/github-user/apps/solitaire）で public/ を入れ替え、依存・マイグレーション・pm2 を動かさない。
      # それ以外（deploy/.htaccess の原本など）は入れない。gate はリンク・特殊ファイルを含む配布物を断るため、
      # ここでも確かめる。隠しファイル（.htaccess）が入ることも確かめる（入らないと no-store・dotfile の拒否が効かない）。
      - name: Create deploy archive
        run: |
          set -euo pipefail
          rm -rf bundle
          mkdir -p bundle/deploy
          cp -a dist bundle/public
          cp deploy/gate-static bundle/deploy/gate-static
          tar -C bundle -czf deploy.tar.gz public deploy/gate-static
          # 一覧はファイルへ書いてから読む（grep -q が先に終わると tar が SIGPIPE で落ち、pipefail で失敗するため）。
          tar -tvzf deploy.tar.gz > bundle.lst
          if grep -vE '^[-d]' bundle.lst; then
            echo "::error::配布物にリンクまたは特殊ファイルが含まれています"
            exit 1
          fi
          tar -tzf deploy.tar.gz > bundle.names
          for required in public/.htaccess public/version.json public/index.html deploy/gate-static; do
            grep -qxF "$required" bundle.names || { echo "::error::配布物に ${required} がありません"; exit 1; }
          done
          cat bundle.names

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: deploy.tar.gz
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    # SSH_PRIVATE_KEY はこのアプリ専用の鍵（#197）。DEPLOY_PATH は gate が置き場を固定するため使わない。
    env:
      SSH_HOST: ${{ secrets.SERVER_HOST }}
      SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
      SSH_USERNAME: ${{ secrets.SERVER_USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-bundle
          path: ./

      # 鍵はサードパーティのアクションを通さず、ランナーの ~/.ssh へ直接置く（#134 で
      # SSH 秘密鍵を渡すアクションの参照を問題にしたため、新たなアクションを足さない）。
      - name: Install SSH key
        run: |
          set -euo pipefail
          [ -n "$SSH_PRIVATE_KEY" ] || { echo "::error::SSH_PRIVATE_KEY が未設定です（このアプリ専用の鍵を同期してください）"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "Host ${SSH_HOST}" "  IdentityFile ~/.ssh/deploy_key" "  IdentitiesOnly yes" > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts

      # **VPSのgate（/usr/local/sbin/app-deploy-gate。guchi-apps/vps#275・#305）へ渡す**（#197）。
      # 鍵はこのアプリ専用で、VPSのauthorized_keysのcommand=がgateのアプリ名 solitaire
      # （置き場 /home/github-user/apps/solitaire）を固定する。任意のシェルコマンドは実行できず、
      # upload・env・deploy の3語だけが通る。配布物に deploy/gate-static があるので、gate は
      # 前回配布物の削除 → public/ の展開 → 権限の調整（置き場 711・public 755/644）→
      # public/version.json の sha と .env の APP_COMMIT_SHA の照合までを行い、依存・pm2 は動かさない。
      # 公開されるのは /home/github-user/apps/solitaire/public（ApacheのDocumentRootは guchi-apps/vps 側）。
      - name: Upload archive
        run: ssh -p "${SSH_PORT}" "${SSH_USERNAME}@${SSH_HOST}" upload < deploy.tar.gz

      - name: Send environment variables
        env:
          # 配信する版の照合に使う（guchi-apps/issue-deck#4712）。gate が .env の APP_COMMIT_SHA と
          # public/version.json の sha を照合する（guchi-apps/vps#305）。コミットのSHAは公開情報。
          # 静的アプリは PORT を持たない（gate-static では不要）。
          APP_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$APP_COMMIT_SHA" in
            *$'\n'*) echo "::error::APP_COMMIT_SHA が改行を含むためgateへ送れません"; exit 1 ;;
          esac
          {
            printf '%s\n' "APP_COMMIT_SHA=${APP_COMMIT_SHA}"
          } | ssh -p "${SSH_PORT}" "${SSH_USERNAME}@${SSH_HOST}" env

      - name: Deploy
        run: ssh -p "${SSH_PORT}" "${SSH_USERNAME}@${SSH_HOST}" deploy

      # gate の照合は置き場のファイルまで。ApacheのDocumentRoot・vhost・TLS の破損は見えないので、
      # 公開URLの応答と中身もランナーから確かめる（#81）。
      #
      # 標準（guchi-apps/docs の standards/ci-deploy.md）は 2秒間隔・最大60秒だが、
      # solitaire は静的サイトで再起動するプロセスが無く起動待ちが存在しない。
      # Apache の reload と重なった瞬断だけを吸収できればよいので 5回（10秒）にする。
      - name: Health check
        env:
          # 公開URLなので secrets にする必要は無い（このリポジトリは public）。
          HEALTH_CHECK_URL: https://klondike.game.gucchii.com/
          # 配信されているのがビルド成果物であることの目印（index.html のルート要素）。
          # 200 だけを見ると、空ディレクトリを配信していても緑になり得る。
          HEALTH_CHECK_MARKER: '<div id="app"'
        run: |
          for i in $(seq 1 5); do
            if body=$(curl -fsS --max-time 10 "$HEALTH_CHECK_URL"); then
              if printf '%s' "$body" | grep -qF "$HEALTH_CHECK_MARKER"; then
                echo "Health check passed on attempt ${i}."
                exit 0
              fi
              echo "Attempt ${i}: responded, but marker was not found in the body."
            else
              echo "Attempt ${i}: request to ${HEALTH_CHECK_URL} failed."
            fi
            sleep 2
          done

          echo "::error::Health check failed for ${HEALTH_CHECK_URL} after 5 attempts."
          exit 1

      # 置き場のファイルが新しくても、Apache が別のディレクトリを配信していれば公開URLは古いまま
      # （DocumentRoot の移し忘れ・経路上のキャッシュ）。公開URLの version.json の sha がこの実行の
      # コミットと一致するまで成功にしない（#193）。version.json は .htaccess で no-store・
      # Service Worker の対象外にしてあるが、経路上のキャッシュに備えて毎回クエリを変えて取りにいく。
      - name: Verify deployed version
        env:
          VERSION_CHECK_URL: https://klondike.game.gucchii.com/version.json
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          attempts=24
          for i in $(seq 1 "$attempts"); do
            url="${VERSION_CHECK_URL}?_=$(date +%s)-${i}"
            if body=$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$url"); then
              actual=$(printf '%s' "$body" | jq -r '.sha // empty' 2>/dev/null || true)
              if [ "$actual" = "$EXPECTED_SHA" ]; then
                echo "Deployed version matches ${EXPECTED_SHA} on attempt ${i}."
                exit 0
              fi
              echo "Attempt ${i}: sha is '${actual}', expected '${EXPECTED_SHA}'."
            else
              echo "Attempt ${i}: request to ${VERSION_CHECK_URL} failed."
            fi
            sleep 5
          done

          echo "::error::${VERSION_CHECK_URL} did not report ${EXPECTED_SHA} within $((attempts * 5)) seconds."
          exit 1

  release:
    runs-on: ubuntu-latest
    needs: [tag, deploy]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect prerelease
        id: meta
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          skip_if_release_exists: true

  notify:
    runs-on: ubuntu-latest
    needs: [tag, build, deploy]
    if: always()

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine workflow status
        id: status
        run: |
          tag="${{ needs.tag.result }}"
          build="${{ needs.build.result }}"
          deploy="${{ needs.deploy.result }}"
          if [ "$tag" = "success" ] && [ "$build" = "success" ] && [ "$deploy" = "success" ]; then
            result=success
          elif [ "$tag" = "cancelled" ] || [ "$build" = "cancelled" ] || [ "$deploy" = "cancelled" ]; then
            result=cancelled
          else
            result=failure
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Signaly に通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を
        # 落とさない（guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_APP: Solitaire
          NOTIFY_KIND: デプロイ
          NOTIFY_STATUS: ${{ steps.status.outputs.result }}
        run: bash .github/scripts/signaly-notify.sh

  notify-release:
    runs-on: ubuntu-latest
    needs: [tag, deploy, release]
    if: always() && needs.release.result != 'skipped'

    # GitHub側の値をここで明示的に渡す。以前は実行のたびに1Passwordから読んで
    # いたが、サービスアカウントの日次レート制限を使い切ってフリート全体の
    # デプロイが止まった（guchi-apps/issue-deck#1302）。SERVER_*・SHARED_DB_*・
    # SUPABASE_* はorganizationの共通値。
    #
    # このブロックは scripts/generate-workflow-env-block.sh で生成する（guchi-apps/issue-deck#1307）。
    env:
      SIGNALY_WEBHOOK_URL: ${{ secrets.SIGNALY_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Signaly に通知
        # 通知はCIやデプロイの合否そのものではない。ここが失敗してもrun全体を
        # 落とさない（guchi-apps/issue-deck#1302）。
        continue-on-error: true
        env:
          SIGNALY_WEBHOOK_URL: ${{ env.SIGNALY_WEBHOOK_URL }}
          NOTIFY_STATUS: ${{ needs.release.result }}
          NOTIFY_APP: Solitaire
          SIGNALY_RELEASE_WEBHOOK_URL: ${{ secrets.SIGNALY_RELEASE_WEBHOOK_URL }}
          NOTIFY_KIND: リリース
          NOTIFY_VERSION: ${{ needs.tag.outputs.tag }}
        run: bash .github/scripts/signaly-notify.sh
